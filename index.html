<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12355B">
<meta name="description" content="Práctica para el examen teórico de conducir Clase B en Chile, con repetición espaciada y progreso por capítulo.">
<title>Examen Clase B · Chile</title>
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#17202A;--mute:#5B6773;--brand:#12355B;--accent:#12355B;--yel:#F2C230;--ok:#1E7A46;--okbg:#E5F3EA;--bad:#B3261E;--badbg:#FBE9E7;--line:#D5DAD3;--road:#2B2F36;--tag:#DDE6EF;--sh:0 2px 8px rgba(18,53,91,.08);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E151D;--card:#17222E;--ink:#E8EDF2;--mute:#9AA8B5;--brand:#1A4673;--accent:#8DB8E8;--ok:#4CC27F;--okbg:#14301F;--bad:#FF7A70;--badbg:#3A1714;--line:#2B3947;--tag:#22364B;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--yel);color:#1b1b1b;display:grid;place-items:center;font:800 1.3rem "Arial Narrow",sans-serif;border:3px solid #fff;outline:2px solid var(--brand)}
.brand{font:800 1.25rem/1.1 "Arial Narrow","Roboto Condensed",sans-serif;color:var(--accent)}
.brand small{display:block;font:500 .72rem "Segoe UI",system-ui,sans-serif;color:var(--mute);letter-spacing:.3px;margin-top:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:8px;background:var(--card);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:260px;font:inherit;font-size:.95rem;font-weight:600;padding:10px;border:0;background:transparent;color:var(--mute);border-radius:12px;cursor:pointer;min-height:46px}
nav button.on{background:var(--brand);color:#fff}
#app>*{animation:in .25s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:flex;gap:14px;align-items:center;background:var(--brand);color:#fff;border-radius:16px;padding:18px;margin:0 0 12px}
.sign{flex:none;width:58px;height:58px;border-radius:13px;background:var(--yel);color:#1b1b1b;display:grid;place-items:center;font:800 2rem "Arial Narrow",sans-serif;border:3px solid #fff}
.hero h1{margin:0;font:800 1.4rem/1.15 "Arial Narrow","Roboto Condensed",sans-serif}
.hero p{margin:4px 0 0;font-size:.85rem;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.plate{background:var(--brand);color:#fff;border:4px solid #fff;outline:3px solid var(--brand);border-radius:14px;padding:18px;margin:6px 3px 18px}
.plate h1{margin:0 0 4px;font:800 1.6rem/1.15 "Arial Narrow","Roboto Condensed",sans-serif}
.plate p{margin:0 0 14px;opacity:.9}
.road{height:26px;background:var(--road);border-radius:6px;position:relative;overflow:hidden}
.road i{position:absolute;left:0;top:11px;height:4px;background:repeating-linear-gradient(90deg,var(--yel) 0 14px,transparent 14px 24px);transition:width .5s}
.pct{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-weight:600}
.card .pct b{font:800 1.6rem "Arial Narrow",sans-serif;color:var(--accent)}
.plate .pct{margin:8px 0 0;font-weight:700}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:1.1rem;min-height:58px;padding:14px 16px;border-radius:14px;border:0;cursor:pointer;background:var(--yel);color:#1b1b1b;margin:10px 0}
.btn.alt{background:var(--card);border:2px solid var(--accent);color:var(--accent)}
.btn.danger{background:transparent;border:2px solid var(--bad);color:var(--bad);font-size:.95rem;min-height:48px}
.btn:active,.smart:active,.tile:active,.opt:active:not(:disabled){transform:scale(.985)}
.btn:focus-visible,nav button:focus-visible,.opt:focus-visible,.tile:focus-visible,.smart:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.smart{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;border:0;border-radius:16px;padding:16px;margin:0 0 14px;background:var(--yel);color:#1b1b1b;cursor:pointer;min-height:74px;box-shadow:var(--sh)}
.smart b{display:block;font-size:1.1rem}.smart small{opacity:.8;font-size:.85rem}
.ic{flex:none;font-size:1.6rem;line-height:1}
.lab{font-size:.85rem;color:var(--mute);font-weight:600}
select,input{width:100%;min-height:52px;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font:inherit;font-weight:600;font-size:.98rem;text-align:left;padding:14px;min-height:92px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:var(--sh)}
.tile .ic{font-size:1.5rem}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 0}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.78rem;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--yel);transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.tag{background:var(--tag);color:var(--accent);border-radius:8px;padding:3px 10px;font-weight:600}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:1.15rem;font-weight:600;margin-bottom:12px;box-shadow:var(--sh)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:1.05rem;min-height:58px;padding:12px 14px;margin:8px 0;background:var(--card);border:2px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink)}
.opt b{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tag);color:var(--accent);font-size:.9rem}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.good::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}
.opt.bad::after{content:"✕";margin-left:auto;color:var(--bad);font-weight:800}
.fb{border-left:6px solid var(--ok);background:var(--card);border-radius:10px;padding:12px 14px;margin:12px 0;box-shadow:var(--sh);animation:in .25s both}
.fb.bad{border-color:var(--bad)}
.fb strong{display:block;font-size:1.1rem;margin-bottom:2px}
h2{font:800 1.2rem "Arial Narrow","Roboto Condensed",sans-serif;color:var(--accent);margin:20px 0 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:.95rem}
.row .g{flex:1}
.row small{color:var(--mute)}
.mini{width:70px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok)}
.big{font:800 3.2rem/1 "Arial Narrow","Roboto Condensed",sans-serif;color:var(--accent);text-align:center;margin:10px 0}
.center{text-align:center}.note{color:var(--mute);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ================================================================
   BANCO DE PREGUNTAS  —  AQUÍ AGREGAS MÁS

     { id: 11,                     // número ÚNICO. Nunca lo cambies ni lo reutilices
       cat: "Velocidad",           // tema (solo para mostrar)
       q: "Pregunta...",
       o: ["CORRECTA", "falsa 1", "falsa 2", "falsa 3"],   // la correcta va SIEMPRE primera;

   Puedes usar 2 a 4 opciones. Verifica cada dato con el Libro del Nuevo Conductor (CONASET).

const QUESTIONS = [
  { id: 1, cat: "Velocidad",

    o: ["Ceda el paso", "Pare", "Prohibido adelantar", "Peligro: curva"],
    why: "El triángulo invertido es \"Ceda el paso\": hay que reducir y dar prioridad a quien circula por la vía preferente." },
  { id: 9, cat: "Usuarios vulnerables",

  { id: 10, cat: "Usuarios vulnerables",
    q: "Al adelantar a un ciclista en la calzada, ¿qué distancia lateral mínima debes dejar?",
    o: ["1,5 metros", "0,5 metros", "1 metro", "No hay distancia mínima"],
    why: "La Ley de Convivencia Vial exige al menos 1,5 m al adelantar a un ciclista. Si no se puede, no se adelanta." }

];

/* CAPÍTULOS DEL LIBRO (índice edición 2026). El número de capítulo es el "ch" de cada pregunta. */
const CH = ["Los siniestros de tránsito", "Los principios de la conducción", "Convivencia vial", "La persona en el tránsito",
  "Usuarios vulnerables", "Normas de circulación", "Circunstancias especiales", "Conducción eficiente", "Informaciones importantes"];
const MAP = { 1: 6, 2: 6, 3: 6, 4: 4, 5: 4, 6: 4, 7: 6, 8: 6, 9: 5, 10: 3 }; // capítulo de las preguntas 1-10

/* FORMATO CORTO PARA AGREGAR MUCHAS: [capítulo 1-9, pregunta, CORRECTA, falsa1, falsa2, falsa3, justificación]
   Las ids se asignan solas (11, 12, 13...). Agrega siempre AL FINAL para no cambiar las ids anteriores. */
const NEW = [
  [1, "Según el libro, ¿por qué se prefiere hablar de \"siniestro\" y no de \"accidente\"?", "Porque la mayoría se puede prevenir; no ocurren por azar", "Porque solo se usa para choques graves", "Porque \"accidente\" está prohibido por ley", "Porque el conductor nunca es responsable", "Un siniestro tiene causas que se pueden evitar con decisiones y conductas seguras."],

  [2, "Si duplicas la velocidad, ¿qué pasa con la distancia de frenado?", "Se multiplica aproximadamente por 4", "Se duplica", "Se mantiene igual", "Se reduce a la mitad", "La energía crece con el cuadrado de la velocidad: al doblar la velocidad, frenar exige cerca de 4 veces más distancia."],
  [2, "La distancia de detención total es la suma de:", "Distancia de reacción + distancia de frenado", "Distancia de frenado + distancia de adelantamiento", "Distancia de seguimiento + distancia visual", "Solo la distancia de frenado", "Primero recorres la distancia de reacción y luego la de frenado."],
  [2, "¿Qué es la distancia de reacción?", "Lo que recorres desde que ves el peligro hasta que empiezas a frenar", "Lo que recorres desde que pisas el freno hasta detenerte", "La distancia entre tu auto y el de adelante", "La distancia que alcanzan las luces bajas", "Es el trayecto \"a ciegas\" mientras el cerebro decide y el pie llega al pedal."],
  [3, "Antes de abrir la puerta de tu auto estacionado en la calle, debes:", "Mirar por el espejo y el costado para no golpear a ciclistas o peatones", "Abrirla rápido para no estorbar", "Avisar con la bocina", "Abrirla solo si el tránsito está detenido", "Abrir sin mirar puede golpear a un ciclista o motociclista que viene por el costado."],
  [3, "En una vía con tránsito mixto, la convivencia vial implica:", "Anticipar a los demás y respetar su espacio y su prioridad", "Que tiene prioridad el vehículo más grande", "Que la calzada es solo para autos", "Acelerar para no entorpecer", "Convivir es compartir la vía de forma segura con todos los usuarios."],
  [3, "Un conductor señala con el intermitente que quiere cambiar de pista. ¿Qué haces si es seguro?", "Facilitar la maniobra, sin acelerar para impedirla", "Acelerar para que no pase", "Tocar la bocina", "Ignorarlo", "La cortesía y la anticipación evitan conflictos y choques."],
  [4, "¿Qué efecto tiene el alcohol en la conducción?", "Reduce la atención, aumenta el tiempo de reacción y falsea la percepción del riesgo", "Mejora los reflejos", "Solo afecta si se bebe en ayunas", "No afecta si después se toma café", "El café no elimina el alcohol; la única opción segura es no beber si vas a manejar."],
  [4, "Si sientes sueño al volante, lo correcto es:", "Detenerte en un lugar seguro y descansar", "Abrir la ventana y subir la música", "Tomar una bebida energética y seguir", "Aumentar la velocidad para llegar antes", "El cansancio reduce la atención como el alcohol; los trucos no sustituyen el descanso."],
  [4, "Usar el celular en la mano mientras conduces:", "Está prohibido y aumenta mucho el riesgo de siniestro", "Está permitido si el tránsito es lento", "Está permitido para mensajes cortos", "Está permitido si lo sostienes con el hombro", "Desvía la vista, las manos y la atención de la conducción."],
  [5, "¿Hasta qué edad es obligatorio el sistema de retención infantil en vehículos particulares?", "Hasta los 8 años inclusive (según talla y peso)", "Hasta los 3 años", "Hasta los 12 años", "No es obligatorio", "El libro exige el sistema de retención hasta los 8 años inclusive, adecuado a la talla y el peso del niño."],

  [7, "Si sufres hidroplaneo, ¿qué debes hacer?", "Soltar el acelerador y mantener el volante firme, sin frenar a fondo", "Frenar a fondo", "Girar el volante bruscamente", "Acelerar para recuperar tracción", "Los neumáticos flotan sobre el agua: movimientos bruscos empeoran la pérdida de control."],

  [8, "¿Qué hábito reduce el consumo de combustible?", "Acelerar y frenar de forma suave y anticipada", "Acelerar fuerte y frenar tarde", "Circular siempre con revoluciones altas", "Llevar carga innecesaria en el portaequipaje", "Anticipar el tránsito evita gastar energía en frenadas y aceleraciones bruscas."],
  [8, "Mantener los neumáticos con la presión recomendada:", "Mejora la seguridad y reduce el consumo", "No influye en el consumo", "Aumenta el desgaste", "Solo importa en carretera", "Una presión incorrecta aumenta el consumo y el desgaste, y empeora el agarre."],
  [8, "Llevar peso innecesario en el vehículo:", "Aumenta el consumo de combustible", "No cambia el consumo", "Reduce el consumo", "Mejora la estabilidad siempre", "A más peso, el motor trabaja más."],
  [9, "¿Qué debes tener al día para circular con tu auto?", "Licencia vigente, permiso de circulación, SOAP y revisión técnica", "Solo la licencia", "Solo el permiso de circulación", "Ninguno si el auto es nuevo", "Son documentos y requisitos del conductor y del vehículo."],

/* ================================================================
   MOTOR: Active Recall + Repetición Espaciada (cajas tipo Leitner)
   - Fallas  -> caja 0 -> vuelve en ~3 respuestas
   - Aciertos -> suben de caja -> vuelven cada vez más tarde
   ================================================================ */
function pick() {
  const base = QUESTIONS.filter(q => !S.f || q.ch === S.f);
  let pool = base.filter(q => q.id !== S.last);
  if (!pool.length) pool = base;
  const due = pool.filter(q => { const c = S.cards[q.id]; return c && c.seen && c.due <= S.tick; });
  if (due.length) {
    const low = Math.min(...due.map(q => S.cards[q.id].box));
    const set = due.filter(q => S.cards[q.id].box === low);
    return set[Math.floor(Math.random() * set.length)];
  }
  const fresh = pool.filter(q => !S.cards[q.id] || !S.cards[q.id].seen);
  if (fresh.length) return fresh[Math.floor(Math.random() * fresh.length)];
  const w = pool.map(q => { const c = card(q.id); return 1 + (4 - c.box) + c.fail; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function chRows() {
  const st = CH.map((n, i) => {
    const qs = QUESTIONS.filter(q => q.ch === i + 1);
    let s = 0, f = 0, m = 0;
    qs.forEach(q => { const c = S.cards[q.id]; if (c) { s += c.seen; f += c.fail; if (c.box >= MASTERED) m++; } });
    return { n, i, s, f, m, t: qs.length, e: s ? Math.round(f / s * 100) : -1 };
  });
  const w = Math.max(...st.map(x => x.e));
  return st.map(x => `<div class="row"><div class="g">${x.i + 1}. ${esc(x.n)}<br>
    <small>${x.s ? `Fallaste ${x.f} de ${x.s} (${x.e}%)` : "Sin responder"} · ${x.m}/${x.t} dominadas</small></div>
    <div class="mini"><i style="width:${x.t ? Math.round(x.m / x.t * 100) : 0}%"></i></div>
    ${x.e === w && w > 0 ? '<b style="color:var(--bad)">Peor</b>' : ""}</div>`).join("");
}

/* ---------- Test de diagnóstico: 3 preguntas por capítulo, sin pistas hasta el final ---------- */
let D = null;
function diagStart() {
  M = null; SM = null;
  const l = [];
  for (let c = 1; c <= CH.length; c++) l.push(...shuffle(QUESTIONS.filter(q => q.ch === c)).slice(0, 3));
  D = { on: true, l: shuffle(l), i: 0, r: {} };
  diagQ();
}
function diagQ() {
  setNav("quiz"); cur = D.l[D.i]; locked = false;
  opts = shuffle(cur.o.map((t, i) => ({ t, ok: i === 0 })));
  app.innerHTML = `<div class="meta"><span class="tag">Test de diagnóstico</span><span>${D.i + 1}/${D.l.length}</span></div>
    <div class="q">${esc(cur.q)}</div>` +
    opts.map((o, i) => `<button class="opt" data-i="${i}"><b>${i + 1}.</b> ${esc(o.t)}</button>`).join("") +
    `<p class="note">Sin pistas: verás el resultado por capítulo al final.</p>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => diagAns(+b.dataset.i));
}
function diagAns(i) {
  if (locked) return; locked = true;
  const ok = opts[i].ok, c = card(cur.id), r = D.r[cur.ch] || (D.r[cur.ch] = { ok: 0, n: 0 });
  r.n++; c.seen++; S.tick++;
  if (ok) { r.ok++; c.ok++; c.box = Math.max(c.box, 1); } else { c.fail++; c.box = 0; }
  c.due = S.tick + GAPS[c.box]; save();
  if (++D.i < D.l.length) diagQ(); else diagEnd();
}
function diagEnd() {
  const arr = Object.keys(D.r).map(k => ({ k: +k, ok: D.r[k].ok, n: D.r[k].n, p: Math.round(D.r[k].ok / D.r[k].n * 100) })).sort((a, b) => b.p - a.p);
  const best = arr[0], worst = arr[arr.length - 1];
  S.f = worst.k; S.dg = { d: Date.now(), r: D.r }; save(); D = null; setNav("home");
  app.innerHTML = `<h2>Tu diagnóstico</h2>
    <p>Lo que mejor sabes: <b>${esc(CH[best.k - 1])}</b> (${best.p}%).<br>Lo más débil: <b>${esc(CH[worst.k - 1])}</b> (${worst.p}%).</p>` +
    arr.map(a => `<div class="row"><div class="g">${a.k}. ${esc(CH[a.k - 1])}<br><small>${a.ok} de ${a.n} correctas</small></div>
      <div class="mini"><i style="width:${a.p}%"></i></div><b>${a.p}%</b></div>`).join("") +
    `<button class="btn" id="sm2">Empezar aprendizaje inteligente</button><button class="btn alt" id="go">Estudiar el capítulo más débil</button><button class="btn alt" id="hm">Volver al inicio</button>`;
  $("#sm2").onclick = smartStart; $("#go").onclick = quiz; $("#hm").onclick = home;
}


/* ---------- Otros métodos de estudio: tarjetas, casos y verdadero/falso ---------- */
let M = null;
function study(k) {
  SM = null;
  const src = k === "f" ? FLASH : k === "c" ? CASES : TF;
  const a = src.filter(x => !S.f || x[0] === S.f);
  M = { k, list: shuffle(a.length ? a : src), i: 0, ok: 0 };
  setNav("quiz"); studyView();
}
function studyView() {
  if (M.i >= M.list.length) {
    if (SM) { smartNext(); return; }
    app.innerHTML = `<div class="center"><div class="big">${M.k === "v" ? M.ok + "/" + M.list.length : "¡Listo!"}</div><p>Terminaste este mazo.</p></div>
      <button class="btn" id="a">Otra vez</button><button class="btn alt" id="h">Inicio</button>`;
    const k = M.k; $("#a").onclick = () => study(k); $("#h").onclick = home; return;
  }
  const x = M.list[M.i], next = () => { M.i++; studyView(); };
  const head = `<div class="meta"><span class="tag">${esc(CH[x[0] - 1])}</span><span>${SM ? "Paso " + (SM.i + 1) + "/" + SM.steps.length + " · " : ""}${M.i + 1}/${M.list.length}</span></div>`;
  if (M.k === "f") {
    app.innerHTML = head + `<button class="q" id="fc" style="width:100%;min-height:160px;text-align:center;cursor:pointer;font:inherit;font-weight:700;font-size:1.25rem;color:var(--ink)">${esc(x[1])}<br><small style="font-weight:400;color:var(--mute)">Piensa tu respuesta y toca para verla</small></button><div id="nx"></div>`;
    $("#fc").onclick = () => { $("#fc").innerHTML = esc(x[2]); $("#nx").innerHTML = `<button class="btn" id="n">Siguiente</button>`; $("#n").onclick = next; };
  } else if (M.k === "c") {
    app.innerHTML = head + `<div class="q">${esc(x[1])}</div><div id="fb"></div><button class="btn" id="sh">Ver la acción correcta</button>`;
    $("#sh").onclick = () => { $("#fb").innerHTML = `<div class="fb"><strong>Acción correcta</strong>${esc(x[2])}</div>`; $("#sh").textContent = "Siguiente caso"; $("#sh").onclick = next; };
  } else {
    app.innerHTML = head + `<div class="q">${esc(x[1])}</div><button class="opt" data-v="1">Verdadero</button><button class="opt" data-v="0">Falso</button><div id="fb"></div>`;
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = (b.dataset.v === "1") === x[2]; if (ok) M.ok++;
      document.querySelectorAll(".opt").forEach(o => { o.disabled = true; if ((o.dataset.v === "1") === x[2]) o.classList.add("good"); else if (o === b) o.classList.add("bad"); });
      $("#fb").innerHTML = `<div class="fb ${ok ? "" : "bad"}"><strong>${ok ? "¡Correcto!" : "Incorrecto"}</strong>${x[2] ? "Es verdadero. " : "Es falso. "}${esc(x[3])}</div><button class="btn" id="n">Siguiente</button>`;
      $("#n").onclick = next;
    });
  }
}


/* ---------- Aprendizaje inteligente: sesión armada según tu diagnóstico y tus fallos ---------- */
let SM = null;
const pri = q => { const c = S.cards[q.id]; if (!c || !c.seen) return 2; return (c.due <= S.tick ? 3 : 0) + (4 - c.box) * 0.5 + c.fail * 0.3; };
const pickN = (arr, n) => shuffle(arr).sort((a, b) => pri(b) - pri(a)).slice(0, n);
function weakness() {
  return CH.map((n, i) => {
    const qs = QUESTIONS.filter(q => q.ch === i + 1); let s = 0, f = 0, m = 0;
    qs.forEach(q => { const c = S.cards[q.id]; if (c) { s += c.seen; f += c.fail; if (c.box >= MASTERED) m++; } });
    return { ch: i + 1, s, f, m, t: qs.length, score: (f + 1) / (s + 2) * 0.6 + (1 - m / qs.length) * 0.4 };
  }).sort((a, b) => b.score - a.score);
}
function smartPlan() {
  const steps = [];
  weakness().slice(0, 2).forEach(x => {
    const of = a => shuffle(a.filter(y => y[0] === x.ch)), nm = CH[x.ch - 1];
    steps.push({ k: "f", title: nm, list: of(FLASH).slice(0, 3) });
    steps.push({ k: "v", title: nm, list: of(TF).slice(0, 2) });
    steps.push({ k: "c", title: nm, list: of(CASES).slice(0, 1) });
    steps.push({ k: "q", title: nm, list: pickN(QUESTIONS.filter(q => q.ch === x.ch), 5) });
  });
  const fails = QUESTIONS.filter(q => S.cards[q.id] && S.cards[q.id].fail > 0);
  steps.push({ k: "q", title: "Repaso de tus fallos", list: pickN(fails.length ? fails : QUESTIONS, 4) });
  return steps;
}
function smartHome() {
  setNav("home"); SM = null;
  const top = weakness().slice(0, 2);
  app.innerHTML = `<section class="plate"><h1>Aprendizaje inteligente</h1>
    <p>${S.dg ? "Según tu test de diagnóstico y tus respuestas, hoy toca reforzar:" : "Conviene hacer primero el test de diagnóstico. Por ahora, esto parece lo más débil:"}</p>
    ${top.map(x => `<div class="row" style="color:var(--ink)"><div class="g">${x.ch}. ${esc(CH[x.ch - 1])}<br><small>${x.s ? "Fallaste " + x.f + " de " + x.s : "Sin datos aún"} · ${x.m}/${x.t} dominadas</small></div></div>`).join("")}</section>
    <p class="note">Sesión de unos 10 minutos: por cada capítulo débil, tarjetas, verdadero o falso, un caso práctico y preguntas; al final, un repaso de tus fallos.</p>
    <button class="btn" id="sg">Empezar sesión</button>
    <button class="btn alt" id="sd">${S.dg ? "Repetir test de diagnóstico" : "Hacer test de diagnóstico"}</button>`;
  $("#sg").onclick = smartStart; $("#sd").onclick = diagStart;
}
function smartStart() { SM = { steps: smartPlan(), i: -1, q: 0, ok: 0 }; smartNext(); }
function smartNext() {
  SM.i++;
  const s = SM.steps[SM.i];
  if (!s) return smartEnd();
  if (!s.list.length) return smartNext();
  SM.cur = s;
  if (s.k === "q") smartQ(s.list, 0);
  else { M = { k: s.k, list: s.list, i: 0, ok: 0 }; setNav("quiz"); studyView(); }
}
function smartQ(list, i) {
  if (i >= list.length) return smartNext();
  cur = list[i]; locked = false; M = null; setNav("quiz");
  opts = shuffle(cur.o.map((t, k) => ({ t, ok: k === 0 })));
  app.innerHTML = `<div class="meta"><span class="tag">${esc(SM.cur.title)}</span><span>Paso ${SM.i + 1}/${SM.steps.length} · ${i + 1}/${list.length}</span></div>
    <div class="q">${esc(cur.q)}</div>` +
    opts.map((o, k) => `<button class="opt" data-i="${k}"><b>${k + 1}.</b> ${esc(o.t)}</button>`).join("") + `<div id="fb"></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (locked) return; locked = true;
    const k = +b.dataset.i, ok = opts[k].ok, c = card(cur.id);
    S.tick++; c.seen++;
    if (ok) { c.ok++; c.box = Math.min(c.box + 1, GAPS.length - 1); } else { c.fail++; c.box = 0; }
    c.due = S.tick + GAPS[c.box]; S.last = cur.id; save();
    SM.q++; if (ok) SM.ok++;
    document.querySelectorAll(".opt").forEach((x, j) => { x.disabled = true; if (opts[j].ok) x.classList.add("good"); else if (j === k) x.classList.add("bad"); });
    $("#fb").innerHTML = `<div class="fb ${ok ? "" : "bad"}"><strong>${ok ? "¡Correcto!" : "Incorrecto"}</strong>${ok ? "" : "La correcta es: <b>" + esc(cur.o[0]) + "</b>. "}${esc(cur.why)}</div><button class="btn" id="nx">Siguiente</button>`;
    $("#nx").onclick = () => smartQ(list, i + 1); $("#nx").focus();
  });
}
function smartEnd() {
  setNav("home");
  const w = weakness()[0], pc = SM.q ? Math.round(SM.ok / SM.q * 100) : 0;
  app.innerHTML = `<div class="center"><p class="meta" style="justify-content:center">Sesión terminada</p><div class="big">${SM.ok}/${SM.q}</div>
    <p>Preguntas correctas (${pc}%). Lo que más conviene reforzar ahora: <b>${esc(CH[w.ch - 1])}</b>.</p></div>
    <button class="btn" id="a">Otra sesión</button><button class="btn alt" id="h">Inicio</button>`;
  $("#a").onclick = smartStart; $("#h").onclick = home;
}


/* ---------- Cuentas con Supabase: registro, inicio de sesión y progreso en la nube ---------- */
const HD = tok => ({ apikey: SUPA_KEY, "Content-Type": "application/json", Authorization: "Bearer " + (tok || SUPA_KEY) });
const saveAC = () => { try { localStorage.setItem("ecb_sesion", JSON.stringify(AC)); } catch (e) {} };
async function refreshTk() {
  try {
    const r = await fetch(SUPA_URL + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: HD(), body: JSON.stringify({ refresh_token: AC.rt }) });
    if (!r.ok) return false;
    const j = await r.json(); AC.tk = j.access_token; AC.rt = j.refresh_token; saveAC(); return true;
  } catch (e) { return false; }
}
async function db(path, opt) {
  const go = () => fetch(SUPA_URL + "/rest/v1/" + path, { ...opt, headers: { ...HD(AC.tk), ...(opt.headers || {}) } });
  let r = await go();
  if (r.status === 401 && await refreshTk()) r = await go();
  return r;
}
let pushT = null;
function push() {
  if (!SUPA_URL || !AC) return;
  clearTimeout(pushT);
  pushT = setTimeout(async () => {
    try {
      const t = totals();
      await db("progreso?on_conflict=user_id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify({ user_id: AC.uid, nombre: AC.nombre, email: AC.email, avance: progress(), respondidas: t.seen, aciertos: t.acc, datos: S, actualizado: new Date().toISOString() }) });
    } catch (e) {}
  }, 1500);
}
async function pull() {
  try {
    const r = await db("progreso?user_id=eq." + AC.uid + "&select=datos", { method: "GET" });
    const j = r.ok ? await r.json() : [];
    if (j[0] && j[0].datos && (j[0].datos.tick || 0) > S.tick) { S = j[0].datos; try { localStorage.setItem(LS_KEY + suf(), JSON.stringify(S)); } catch (e) {} }
    else push();
  } catch (e) {}
}
async function auth(mode, nombre, email, pass) {
  const r = await fetch(SUPA_URL + "/auth/v1/" + (mode === "up" ? "signup" : "token?grant_type=password"), { method: "POST", headers: HD(),
    body: JSON.stringify(mode === "up" ? { email, password: pass, data: { nombre } } : { email, password: pass }) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "No se pudo completar la acción");
  if (!j.access_token) return "confirmar";
  AC = { tk: j.access_token, rt: j.refresh_token, uid: j.user.id, email: j.user.email, nombre: (j.user.user_metadata && j.user.user_metadata.nombre) || nombre || email.split("@")[0] };
  saveAC(); S = load(); await pull(); return "ok";
}
function authView(mode) {
  setNav("home");
  const up = mode === "up";
  app.innerHTML = `<section class="hero"><div class="sign">B</div><div><h1>${up ? "Crear cuenta" : "Iniciar sesión"}</h1><p>Guarda tu avance y úsalo en cualquier dispositivo</p></div></section>
    <div class="card">
      ${up ? '<input id="an" placeholder="Nombre" autocomplete="name" aria-label="Nombre">' : ""}
      <input id="ae" type="email" placeholder="Correo" autocomplete="email" aria-label="Correo">
      <input id="ap" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="${up ? "new-password" : "current-password"}" aria-label="Contraseña">
      <p id="am" class="note" style="min-height:1.4em"></p>
      <button class="btn" id="ab">${up ? "Crear cuenta" : "Entrar"}</button>
      <button class="btn alt" id="at">${up ? "Ya tengo cuenta" : "Crear una cuenta nueva"}</button>
    </div>
    <button class="btn alt" id="ag">Continuar sin cuenta</button>`;
  const msg = t => { $("#am").textContent = t; };
  const go = async () => {
    const n = up ? $("#an").value.trim() : "", e = $("#ae").value.trim(), p = $("#ap").value;
    if ((up && !n) || !e || p.length < 6) return msg("Completa todos los campos (contraseña de 6 o más caracteres).");
    $("#ab").disabled = true; msg("Un momento...");
    try {
      const r = await auth(mode, n, e, p);
      if (r === "confirmar") { $("#ab").disabled = false; msg("Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión."); } else home();
    } catch (x) { $("#ab").disabled = false; msg(/invalid login/i.test(x.message) ? "Correo o contraseña incorrectos." : x.message); }
  };
  $("#ab").onclick = go; $("#ap").onkeydown = ev => { if (ev.key === "Enter") go(); };
  $("#at").onclick = () => authView(up ? "in" : "up"); $("#ag").onclick = home;
}
function acctBox() {
  if (!SUPA_URL) return "";
  return AC ? `<div class="card"><b>${esc(AC.nombre)}</b><br><small class="note">${esc(AC.email)} · avance sincronizado</small><button class="btn alt" id="lo">Cerrar sesión</button></div>`
    : `<div class="card"><b>Sin cuenta</b><br><small class="note">Tu avance solo está en este dispositivo.</small><button class="btn alt" id="li">Iniciar sesión o registrarme</button></div>`;
}
function acctBind() {
  if ($("#lo")) $("#lo").onclick = () => { AC = null; try { localStorage.removeItem("ecb_sesion"); } catch (e) {} S = load(); authView("in"); };
  if ($("#li")) $("#li").onclick = () => authView("in");
}

$("#nHome").onclick = home; $("#nStats").onclick = stats;
document.addEventListener("keydown", e => {
  if (view !== "quiz" || M || SM) return;
  if (e.key >= "1" && e.key <= "9" && !locked && opts[+e.key - 1]) (D && D.on ? diagAns : answer)(+e.key - 1);
});
if (!AC && SUPA_URL) authView("in"); else { home(); if (AC) pull().then(() => { if (view === "home") home(); }); }
</script>
